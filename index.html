<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adax: Zrekrutuj do GDG</title>
    <link rel="icon" type="image/png" href="./rest/point.png">
    <link rel="shortcut icon" type="image/png" href="./rest/point.png">
    <link rel="apple-touch-icon" href="./rest/point.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gdg-blue: #4285F4;
            --gdg-red: #EA4335;
            --gdg-yellow: #FBBC04;
            --gdg-green: #34A853;
            --bg-color: #080b12;
            --card-bg: rgba(14, 20, 32, 0.88);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #4285F4;
            --primary-glow: rgba(66, 133, 244, 0.45);
            --accent-gold: #FBBC04;
            --accent-green: #34A853;
            --accent-red: #EA4335;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-main: 'Outfit', sans-serif;
            --font-mono: 'Space Grotesk', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(66, 133, 244, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(234, 67, 53, 0.10) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(52, 168, 83, 0.06) 0%, transparent 60%),
                linear-gradient(to bottom, #06080e, #0c111c);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: min(96vw, calc(92vh * (1200 / 750)));
            aspect-ratio: 1200 / 750;
            max-width: 1200px;
            max-height: 750px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.9),
                        0 0 0 1px var(--card-border),
                        0 0 50px -10px rgba(66, 133, 244, 0.25);
            background: #090d16;
            container-type: size;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #090e18;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(6, 9, 15, 0.88);
            backdrop-filter: blur(12px);
            z-index: 20;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            opacity: 1;
            visibility: visible;
            padding: 4cqw;
            text-align: center;
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gdg-badge-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: clamp(10px, 1.1cqw, 13px);
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6cqh 1.5cqw;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 2cqh;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .gdg-dots {
            display: inline-flex;
            gap: 5px;
        }
        .gdg-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .dot-blue { background: var(--gdg-blue); }
        .dot-red { background: var(--gdg-red); }
        .dot-yellow { background: var(--gdg-yellow); }
        .dot-green { background: var(--gdg-green); }

        .game-title {
            font-size: clamp(22px, 3.8cqw, 46px);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 15%, var(--gdg-blue) 45%, var(--gdg-yellow) 75%, var(--gdg-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5cqh;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .game-subtitle {
            font-size: clamp(11px, 1.3cqw, 15px);
            color: var(--text-muted);
            max-width: 52cqw;
            line-height: 1.5;
            margin-bottom: 3cqh;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gdg-blue) 0%, #1a73e8 100%);
            color: #ffffff;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: clamp(11px, 1.3cqw, 16px);
            letter-spacing: 0.5px;
            padding: clamp(8px, 1.6cqh, 14px) clamp(16px, 2.8cqw, 36px);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 10px 30px -5px var(--primary-glow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 35px -3px var(--primary-glow);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--gdg-red) 0%, #c5221f 100%);
            box-shadow: 0 10px 25px -5px rgba(234, 67, 53, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--gdg-green) 0%, #1e8e3e 100%);
            box-shadow: 0 10px 25px -5px rgba(52, 168, 83, 0.4);
        }

        .controls-card {
            margin-top: 2cqh;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5cqh 2cqw;
            display: flex;
            gap: 1.5cqw;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: clamp(10px, 1cqw, 12px);
            color: var(--text-muted);
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-family: var(--font-mono);
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: clamp(9px, 0.9cqw, 11px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
        }

        #game-hud {
            position: absolute;
            top: 2cqh;
            left: 2cqw;
            right: 2cqw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 1cqw;
            pointer-events: auto;
        }

        .hud-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            padding: 1cqh 1.2cqw;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 1cqw;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .hud-stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-icon {
            width: clamp(24px, 2.6cqw, 32px);
            height: clamp(24px, 2.6cqw, 32px);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(11px, 1.2cqw, 15px);
            font-weight: bold;
        }

        .hud-icon.level {
            background: rgba(66, 133, 244, 0.15);
            color: var(--gdg-blue);
            border: 1px solid rgba(66, 133, 244, 0.35);
        }

        .hud-icon.score {
            background: rgba(251, 188, 4, 0.15);
            color: var(--gdg-yellow);
            border: 1px solid rgba(251, 188, 4, 0.35);
        }

        .hud-icon.recruits {
            background: rgba(52, 168, 83, 0.15);
            color: var(--gdg-green);
            border: 1px solid rgba(52, 168, 83, 0.35);
        }

        .hud-label {
            font-size: clamp(8px, 0.8cqw, 10px);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .hud-value {
            font-family: var(--font-mono);
            font-size: clamp(12px, 1.4cqw, 16px);
            font-weight: 700;
            color: #fff;
        }

        .hud-level-desc {
            font-size: clamp(8px, 0.8cqw, 10px);
            color: var(--gdg-blue);
            font-weight: 600;
            max-width: 10cqw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lives-container {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .heart {
            font-size: clamp(13px, 1.5cqw, 18px);
            color: var(--gdg-red);
            filter: drop-shadow(0 0 6px rgba(234, 67, 53, 0.6));
            transition: transform 0.2s, opacity 0.2s;
        }

        .heart.lost {
            opacity: 0.25;
            filter: grayscale(1);
            transform: scale(0.85);
        }

        .shield-badge {
            font-size: clamp(13px, 1.5cqw, 16px);
            margin-left: 4px;
            color: #00f0ff;
            filter: drop-shadow(0 0 6px rgba(0,240,255,0.8));
        }

        .recruit-progress-bar {
            width: 8cqw;
            min-width: 60px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 3px;
        }

        .recruit-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gdg-green), var(--gdg-blue));
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
        }

        .perk-active-container {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .perk-active-badge {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--card-border);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: clamp(9px, 0.9cqw, 11px);
            font-family: var(--font-mono);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-icon {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            width: clamp(28px, 3cqw, 38px);
            height: clamp(28px, 3cqw, 38px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: clamp(12px, 1.3cqw, 16px);
            backdrop-filter: blur(8px);
        }

        .btn-icon:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        #level-cleared-modal, #pause-modal {
            position: absolute;
            inset: 0;
            background: rgba(6, 9, 15, 0.85);
            backdrop-filter: blur(10px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
        }

        #level-cleared-modal.active, #pause-modal.active {
            opacity: 1;
            visibility: visible;
        }

            border: 2px solid var(--gd
